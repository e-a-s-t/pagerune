# Local development only. Run via direnv so secrets come from .env/.envrc.local.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Load .env with direnv}
      POSTGRES_USER: ${POSTGRES_USER:?Load .env with direnv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Load .env with direnv}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [database]

  keycloak-db-init:
    image: postgres:17.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?Load .env with direnv}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Load .env with direnv}
      PGDATABASE: ${POSTGRES_DB:?Load .env with direnv}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set in .env}
    volumes:
      - ./deploy/postgres/create-keycloak-db.sh:/create-keycloak-db.sh:ro
    entrypoint: ["sh", "/create-keycloak-db.sh"]
    restart: "no"
    networks: [database]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/pagerune_keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set in .env}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8081"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://keycloak.localhost:8081
      KC_HOSTNAME_STRICT: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set in .env}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set in .env}
      PAGERUNE_PROXY_PORT: ${PAGERUNE_PROXY_PORT:-8088}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./deploy/keycloak/realm-template.json:/realm-template.json:ro
      - ./deploy/keycloak/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      database:
      auth:
        aliases:
          - keycloak.localhost

  pagerune:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PAGERUNE_BIND: 0.0.0.0:8080
      PAGERUNE_DEV_API_ENABLED: "true"
      PAGERUNE_TRUSTED_PROXY_MODE: "true"
      PAGERUNE_TURNSTILE_TEST_MODE: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:?Load .env with direnv}:${POSTGRES_PASSWORD:?Load .env with direnv}@postgres:5432/${POSTGRES_DB:?Load .env with direnv}
      PAGERUNE_TOKEN_KEY: ${PAGERUNE_TOKEN_KEY:?Set in .env}
      PAGERUNE_PUBLIC_BASE_URL: http://localhost:${PAGERUNE_PROXY_PORT:-8088}
      PAGERUNE_EMAIL_TEMPLATE_DIR: /app/templates/email
      PAGERUNE_TURNSTILE_SITE_KEY: local-test-site-key
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS_MODE: none
      SMTP_FROM_EMAIL: updates@localhost
      SMTP_FROM_NAME: PageRune
      RUST_LOG: pagerune=info
    depends_on:
      pagerune-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      database: {}
      pagerune-proxy:
        aliases: [pagerune]
      outbound: {}

  pagerune-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate"]
    environment:
      PAGERUNE_BIND: 127.0.0.1:8080
      PAGERUNE_DEV_API_ENABLED: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:?Load .env with direnv}:${POSTGRES_PASSWORD:?Load .env with direnv}@postgres:5432/${POSTGRES_DB:?Load .env with direnv}
      PAGERUNE_TOKEN_KEY: ${PAGERUNE_TOKEN_KEY:?Set in .env}
      PAGERUNE_TURNSTILE_TEST_MODE: "true"
      PAGERUNE_TURNSTILE_SITE_KEY: local-test-site-key
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [database]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.14.2
    depends_on:
      keycloak:
        condition: service_healthy
      pagerune:
        condition: service_healthy
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak.localhost:8081/realms/pagerune
      OAUTH2_PROXY_CLIENT_ID: pagerune-management
      OAUTH2_PROXY_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?Set in .env}
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:${PAGERUNE_PROXY_PORT:-8088}/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_ALLOWED_GROUPS: /pagerune-management
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: groups
      OAUTH2_PROXY_SCOPE: "openid email"
      OAUTH2_PROXY_UPSTREAMS: http://pagerune:8080/
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "GET=^/$,GET=^/subscribe/[^/]+$,POST=^/subscribe/[^/]+$,GET=^/verify/[^/]+$,POST=^/verify/[^/]+$,GET=^/manage$,POST=^/manage$,GET=^/manage/[^/]+$,POST=^/manage/[^/]+$,POST=^/manage/unsubscribe/.*$,GET=^/unsubscribe/[^/]+$,POST=^/unsubscribe/[^/]+$,GET=^/static/.*$"
      OAUTH2_PROXY_API_ROUTES: "^/api/v1/.*$"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_REVERSE_PROXY: "false"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
    ports:
      - "127.0.0.1:${PAGERUNE_PROXY_PORT:-8088}:4180"
    networks: [pagerune-proxy, auth]

  # Host-mode Devbox workflow. Select this service instead of oauth2-proxy and
  # run PageRune on the host at the Docker bridge gateway address on port 8082.
  oauth2-proxy-host:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.14.2
    profiles: [host-app]
    depends_on:
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak.localhost:8081/realms/pagerune
      OAUTH2_PROXY_CLIENT_ID: pagerune-management
      OAUTH2_PROXY_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?Set in .env}
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:${PAGERUNE_PROXY_PORT:-8088}/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_ALLOWED_GROUPS: /pagerune-management
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: groups
      OAUTH2_PROXY_SCOPE: "openid email"
      OAUTH2_PROXY_UPSTREAMS: http://host.docker.internal:8082/
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "GET=^/$,GET=^/subscribe/[^/]+$,POST=^/subscribe/[^/]+$,GET=^/verify/[^/]+$,POST=^/verify/[^/]+$,GET=^/manage$,POST=^/manage$,GET=^/manage/[^/]+$,POST=^/manage/[^/]+$,POST=^/manage/unsubscribe/.*$,GET=^/unsubscribe/[^/]+$,POST=^/unsubscribe/[^/]+$,GET=^/static/.*$"
      OAUTH2_PROXY_API_ROUTES: "^/api/v1/.*$"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_REVERSE_PROXY: "false"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_AUTH_STRIP_HEADERS: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
    ports:
      - "127.0.0.1:${PAGERUNE_PROXY_PORT:-8088}:4180"
    networks: [auth]

  mailpit:
    image: axllent/mailpit:v1.27.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks: [database]

volumes:
  postgres-data:

networks:
  database: {}
  pagerune-proxy: {}
  auth: {}
  outbound: {}
