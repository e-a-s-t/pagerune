name: Docker image

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  # Override with the optional repository variable DOCKERHUB_IMAGE.
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'erjoda/pagerune' }}

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=PageRune
            org.opencontainers.image.description=Self-hosted website update subscriptions

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH or a SemVer prerelease suffix." >&2
            exit 1
          fi

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Protect an existing exact release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -o pipefail
          version="${RELEASE_VERSION#v}"
          set +e
          inspection="$(docker buildx imagetools inspect "${IMAGE_NAME}:${version}" 2>&1)"
          status=$?
          set -e

          if [[ ${status} -eq 0 ]]; then
            echo "${IMAGE_NAME}:${version} already exists; exact release tags are immutable." >&2
            exit 1
          fi

          if printf '%s\n' "${inspection}" | grep --ignore-case --extended-regexp --quiet 'not found|manifest unknown|name unknown'; then
            exit 0
          fi

          echo "Could not determine whether ${IMAGE_NAME}:${version} exists; refusing to publish." >&2
          printf '%s\n' "${inspection}" >&2
          exit "${status}"

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
