{% extends "base.html" %}
{% block title %}Confirm subscription — PageRune{% endblock %}
{% block content %}
<section class="message-card">
  <p class="eyebrow">One last step</p>
  <h1>Confirm your email</h1>
  <p>Confirm that this address belongs to you to activate the website subscription.</p>
  <form method="post" action="/verify/{{ token }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button class="button" type="submit">Confirm subscription</button>
  </form>
</section>
{% endblock %}
